name: Windows x64 build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build WinDiag.exe
        shell: cmd
        run: cl /nologo /W4 /O2 /MT /std:c11 /D_WIN32_WINNT=0x0601 src\windiag.c /link psapi.lib pdh.lib winhttp.lib shell32.lib advapi32.lib /OUT:WinDiag.exe
      - uses: actions/upload-artifact@v4
        with:
          name: WinDiag-windows-x64
          path: WinDiag.exe
          if-no-files-found: error
